[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucifix"
version = "0.1.0"
description = "Attach debuggers to running Python processes, run tests, and use AI to brute-force fix failures."
requires-python = ">=3.10"
dependencies = [
    "debugpy>=1.8",
    "openai>=1.0",
    "google-genai>=1.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
hallucifix = "hallucifix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
